<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم المؤمنة - منصة القوالب</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #030712 !important;
            color: #f3f4f6 !important;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
        }
        #adminLockScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
            display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        .admin-card {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 35px;
            border-radius: 16px;
            width: 350px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        #adminPanelContent { display: none; padding: 40px; }
        .secure-badge {
            background: #ef4444;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <!-- العلامة المائية الرسمية في الزاوية -->
    <div class="dev-badge">📑 إدارة وتطوير أبو العز العمري</div>

    <!-- شاشة الحماية المشفرة -->
    <div id="adminLockScreen">
        <div class="admin-card">
            <span class="secure-badge">منطقة إدارية مشفرة 🔒</span>
            <h2 style="margin-bottom: 10px; color: #ffffff;">تسجيل دخول المشرف</h2>
            <p style="font-size: 13px; color: #94a3b8; margin-bottom: 25px;">يرجى إدخال مفتاح الصلاحية السري</p>
            
            <input type="password" id="adminPasswordInput" placeholder="أدخل كلمة المرور السرية" style="width:100%; padding:12px; margin-bottom:15px; background:#0f172a; color:white; border:1px solid #334155; border-radius:8px; text-align: center; font-size: 16px; outline: none;">
            
            <button class="btn-primary full-width" onclick="checkAdminPassword()" style="padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; background: #2563eb;">دخول آمن 🛡️</button>
            <p id="errorMsg" style="color: #f87171; font-size: 13px; margin-top: 15px; font-weight: bold;"></p>
        </div>
    </div>

    <!-- محتوى لوحة الإدارة -->
    <div id="adminPanelContent">
        <header style="border-bottom: 1px solid #1e293b; padding-bottom: 20px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center;">
            <h1 style="color: #60a5fa; margin: 0; font-size: 24px;">✨ لوحة تحكم المشرف (إدارة الطلبات)</h1>
            <a href="#" onclick="logoutAdmin()" style="color: #f87171; text-decoration: none; font-weight: bold;">قفل اللوحة 🔒</a>
        </header>

        <div style="background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid #334155;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="margin: 0; color: #ffffff;">📦 طلبات الشراء الواردة من مالتشات</h3>
                <button onclick="loadOrders()" style="background: #3b82f6; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold;">تحديث الطلبات 🔄</button>
            </div>
            <p style="color: #94a3b8; font-size: 14px; margin-bottom: 20px;">الطلبات المسجلة من العملاء في سحابة Firebase:</p>
            
            <div id="ordersList" style="background: #0f172a; padding: 15px; border-radius: 8px; min-height: 120px; color: #cbd5e1; overflow-x: auto;">
                اضغط على زر "تحديث الطلبات" لجلب البيانات الحية...
            </div>
        </div>
    </div>

    <!-- سكريبت الحماية وجلب الطلبات -->
    <script>
        // كلمة المرور المشفرة (كلمة المرور الفعلية هي: joml2026_secure)
        const ENCRYPTED_KEY = "am9tbDIwMjZfc2VjdXJl"; 

        function checkAdminPassword() {
            const enteredPass = document.getElementById('adminPasswordInput').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            if (btoa(enteredPass) === ENCRYPTED_KEY) {
                document.getElementById('adminLockScreen').style.display = 'none';
                document.getElementById('adminPanelContent').style.display = 'block';
                loadOrders(); // جلب الطلبات فور الدخول
            } else {
                errorMsg.innerText = "❌ مفتاح الدخول غير صالح!";
                document.getElementById('adminPasswordInput').value = "";
            }
        }

        function logoutAdmin() {
            location.reload();
        }
    </script>

    <!-- سكريبت جلب وعرض طلبات Firebase سحابياً -->
    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, getDocs } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

        window.loadOrders = async function() {
            const listDiv = document.getElementById('ordersList');
            listDiv.innerHTML = "جاري جلب الطلبات من السحابة...";
            
            try {
                const querySnapshot = await getDocs(collection(db, "orders"));
                if (querySnapshot.empty) {
                    listDiv.innerHTML = "لا توجد طلبات شراء حتى الآن.";
                    return;
                }

                let htmlContent = "<table style='width:100%; text-align:right; border-collapse: collapse;'>";
                htmlContent += "<tr style='border-bottom: 2px solid #334155; padding-bottom: 10px;'><th style='padding: 8px;'>البريد الإلكتروني للعميل</th><th style='padding: 8px;'>نوع الترخيص</th><th style='padding: 8px;'>السعر</th><th style='padding: 8px;'>حالة الطلب</th></tr>";
                
                querySnapshot.forEach((doc) => {
                    const order = doc.data();
                    htmlContent += `<tr style='border-bottom: 1px solid #1e293b;'>
                        <td style='padding: 10px; color: #60a5fa;'>${order.userEmail}</td>
                        <td style='padding: 10px;'>${order.licenseType}</td>
                        <td style='padding: 10px;'>$${order.price}</td>
                        <td style='padding: 10px; color: #f59e0b; font-weight: bold;'>${order.status}</td>
                    </tr>`;
                });
                
                htmlContent += "</table>";
                listDiv.innerHTML = htmlContent;
            } catch (error) {
                listDiv.innerHTML = "خطأ في الاتصال بقاعدة البيانات: " + error.message;
            }
        }
    </script>

</body>
</html>
