<script type="module">
    import { db, auth } from './firebase-config.js';
    import { collection, addDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

    let currentPrice = 15;
    let currentLicense = 'personal';

    window.updatePrice = function(price, type) {
        currentPrice = price;
        currentLicense = type;
        document.getElementById('priceDisplay').innerText = "السعر: $" + price;
    }

    window.payViaMalchat = async function() {
        const user = auth.currentUser;
        
        // التحقق من أن المستخدم مسجل دخول
        if (!user) {
            alert("يرجى تسجيل الدخول أولاً لتتمكن من إتمام عملية الشراء!");
            window.location.href = 'auth.html';
            return;
        }

        try {
            // حفظ طلب الشراء في قاعدة بيانات فايربيس (Firestore) كطلب "قيد الانتظار"
            await addDoc(collection(db, "orders"), {
                userEmail: user.email,
                licenseType: currentLicense,
                price: currentPrice,
                status: "pending", // قيد المراجعة حتى يتم التحقق من الدفع
                timestamp: new Date()
            });

            // رابط محفظة مالتشات الحقيقي الخاص بك
            const malchatLink = "https://malchat.app/wallet/YOUR_WALLET_ID"; // استبدل برابط محفظتك الفعلي

            alert("تم تسجيل طلبك بنجاح! سيتم تحويلك الآن إلى محفظة مالتشات لإتمام الدفع بقيمة ($" + currentPrice + ").");
            window.open(malchatLink, '_blank');

        } catch (error) {
            alert("حدث خطأ أثناء تسجيل الطلب: " + error.message);
        }
    }
</script>
